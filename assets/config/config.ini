# KenshiLua Configuration File
# ----------------------------

# Set to true to run the benchmark system on game startup and log results to logs/KenshiLua_Benchmark.log
enable_benchmark=false

# Global log level (default, warning, error, debug)
log_level=default

# Keyboard shortcut to toggle the developer GUI.
# Available keys: KC_A to KC_Z, KC_F1 to KC_F12, KC_1 to KC_0, escape, tab, return, space, etc.
toggle_gui_key=KC_L

# GUI toggle modifier key configurations
toggle_gui_ctrl=true
toggle_gui_shift=true
toggle_gui_alt=false

# Start minimized (if true, toggled using keybind. if false, visible on start)
start_minimized=true

# Automatic file-watcher hot reload system (default false)
enable_hot_reload=false

# Developer option: keep a separate log for every game session (default false).
# The current session always writes logs/KenshiLua.log. When true, the previous
# session's log is kept as logs/KenshiLua_<date>_<time>.log at startup.
# Takes effect the next time the game starts.
keep_session_logs=false

# Maximum number of earlier session logs to keep when keep_session_logs is true (0 keeps all)
max_session_logs=20


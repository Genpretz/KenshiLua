name: Upload release to Nexus Mods

on:
  release:
    types: [published]
  # Run by hand for a release that already exists, for example after replacing
  # its zip or after a failed upload.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to upload, such as v0.3.12-alpha
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-mods-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload-to-nexus-mods:
    name: Upload KenshiLua release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download KenshiLua release asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          asset_name="KenshiLua ${TAG_NAME}.zip"
          asset_path="release-assets/${asset_name}"

          # GitHub replaces the space in an uploaded file name with a dot, so the
          # release holds "KenshiLua.<tag>.zip" although the packaged file is
          # "KenshiLua <tag>.zip". The pattern accepts either name.
          if ! gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "KenshiLua?${TAG_NAME}.zip" \
            --dir release-assets; then
            echo "::error::Release ${TAG_NAME} has no asset named 'KenshiLua ${TAG_NAME}.zip' or 'KenshiLua.${TAG_NAME}.zip'. Attach the zip to the release, then run this workflow by hand with the tag."
            exit 1
          fi

          downloaded="$(find release-assets -maxdepth 1 -type f -name "KenshiLua?${TAG_NAME}.zip" | head -n 1)"
          if [[ -z "${downloaded}" ]]; then
            echo "::error::The release asset was not downloaded: ${asset_name}"
            exit 1
          fi
          if [[ "${downloaded}" != "${asset_path}" ]]; then
            mv "${downloaded}" "${asset_path}"
          fi

          {
            echo "version=${version}"
            echo "tag=${TAG_NAME}"
            echo "asset_path=${asset_path}"
            echo "changelog<<KENSHILUA_CHANGELOG_END"
            gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body
            echo "KENSHILUA_CHANGELOG_END"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release to Nexus Mods
        id: upload
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ steps.release.outputs.asset_path }}
          version: ${{ steps.release.outputs.version }}
          display_name: KenshiLua ${{ steps.release.outputs.tag }}
          description: |-
            Regular Users: Install and enable in launcher.

            Modders: Changes were made in the various parts of the API. Backwards compatibility is maintained so older scripts will still run. KenshiLua.log will log uses of the old API and remind you to update.
          category: main
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: true
          update_mod_version: true
          changelog: ${{ steps.release.outputs.changelog }}

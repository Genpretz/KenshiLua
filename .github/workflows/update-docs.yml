name: Update generated documentation

on:
  push:
    branches: [main, master]
    paths:
      - "src/Bindings/**"
      - "src/Callbacks.h"
      - "src/Hooks/Hooks_Registry.cpp"
      - "tools/docs/**"
      - "tools/audit/**"
      - ".github/workflows/update-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-generated-documentation
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate documentation
        run: |
          python tools/docs/generate_bindings_reference.py
          python tools/docs/generate_mygui_reference.py
          python tools/docs/generate_enums_reference.py
          python tools/docs/generate_callbacks_reference.py
          python tools/audit/generate_unbound_reference.py

      - name: Commit updated documentation
        run: |
          if git diff --quiet -- docs; then
            echo "Generated documentation is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: regenerate references"
          git push
